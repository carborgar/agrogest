{% extends 'accounts/auth_base.html' %}

{% block title %}Contraseña cambiada · AgroGest{% endblock %}

{% block auth_content %}
<div class="card card-flat">
    <div class="hm-empty">
        <span class="hm-empty-icon"><i aria-hidden="true" class="fas fa-check"></i></span>
        <h1 class="h5 fw-bold mb-0 text-body">¡Contraseña cambiada!</h1>
        <span>Tu contraseña se ha restablecido correctamente.
            Ya puedes iniciar sesión con tu nueva contraseña.</span>
        <a class="tf-btn tf-btn--primary w-100 mt-3" href="{% url 'accounts:login' %}">Iniciar sesión</a>
    </div>
</div>
{% endblock %}
