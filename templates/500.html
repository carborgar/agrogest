{% extends "accounts/auth_base.html" %}

{% block title %}Error del servidor · AgroGest{% endblock %}

{% block auth_content %}
<div class="card card-flat">
    <div class="hm-empty">
        <span class="hm-empty-icon hm-empty-icon--warn"><i aria-hidden="true" class="fas fa-exclamation-triangle"></i></span>
        <p class="fs-1 fw-bold lh-1 mb-0 text-body-secondary">500</p>
        <h1 class="h5 fw-bold mb-0 text-body">Error del servidor</h1>
        <span>Lo sentimos, ha habido un problema técnico. Se ha reportado y estamos trabajando
            para solucionarlo.</span>
        <a class="tf-btn tf-btn--primary w-100 mt-3" href="{% url 'home' %}">Volver al inicio</a>
    </div>
</div>
{% endblock %}
