<!DOCTYPE html>
<html class="{% if sidebar_collapsed %}sidebar-collapsed{% endif %}" lang="es">
<head>
    {% load django_bootstrap5 %}
    {% load static static_versioned %}

    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{% block title %}AgroGest{% endblock %}</title>

    <!-- Iconos: favicon (pestaña), pantalla de inicio de iPhone y manifest para Android -->
    <link rel="icon" href="{% static_v 'img/icons/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static_v 'img/icons/favicon-32.png' %}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="{% static_v 'img/icons/apple-touch-icon.png' %}">
    <meta name="apple-mobile-web-app-title" content="AgroGest">
    <link rel="manifest" href="{% static_v 'manifest.webmanifest' %}">

    <!-- Brand typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Use our custom Bootstrap theme instead of the default -->
    <link href="{% static 'css/custom-bootstrap.min.css' %}" rel="stylesheet">
    <script>
        /* Lateral plegado por debajo del breakpoint xl de Bootstrap (tableta,
           portátil pequeño). Va aquí, antes de pintar, para que no dé un salto. */
        (function () {
            var xl = getComputedStyle(document.documentElement).getPropertyValue('--bs-breakpoint-xl').trim() || '1200px';
            if (!window.matchMedia('(min-width: ' + xl + ')').matches) {
                document.documentElement.classList.add('sidebar-collapsed');
            }
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <link href="{% static 'css/treatment-styles.css' %}" rel="stylesheet">
    <link href="{% static 'css/calendar.css' %}" rel="stylesheet">
    <link href="{% static 'css/menu.css' %}" rel="stylesheet">
    <link href="{% static 'css/sweetalert2-custom.css' %}" rel="stylesheet">
    <link href="{% static 'css/tables.css' %}" rel="stylesheet">

    {% block extra_head %} {% endblock %}
</head>
<body>

{% block base_content %} {% endblock %}

{% bootstrap_javascript %}
<script crossorigin="anonymous"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{% static 'js/submit-guard.js' %}"></script>

{% block base_extra_js %} {% endblock %}
</body>
</html>
